<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benchmark Reports</title>
    <style>
        /* CSS for layout and styling */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Styles for the top navigation bar */
        #top-nav { 
            background-color: #333;
            color: #fff;
            padding: 10px 20px; 
            border-bottom: 1px solid #555;
            box-sizing: border-box;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
            font-size: 0.75em; 
        }
        
        .nav-section {
            display: flex;
            align-items: center;
        }

        #top-nav h2 {
            margin: 0;
            margin-right: 20px;
            font-size: 1em; 
            font-weight: bold;
            text-transform: uppercase;
            white-space: nowrap;
        }
        #top-nav a { 
            padding: 8px 12px; 
            margin: 0 5px;
            text-decoration: none; 
            color: #fff;
            border-radius: 5px;
            transition: background-color 0.2s;
            cursor: pointer;
            white-space: nowrap;
        }
        #top-nav a:hover { 
            background-color: #555;
        }
        #top-nav a.active {
            background-color: #007BFF;
            color: #fff;
        }

        /* Zoom Control Styles */
        .zoom-controls button {
            background-color: #555;
            color: white;
            border: none;
            border-radius: 5px;
            width: 30px;
            height: 30px;
            font-size: 1.5em; 
            font-weight: bold;
            cursor: pointer;
            margin-left: 5px;
        }
        .zoom-controls button:hover {
            background-color: #777;
        }
        .zoom-controls span {
            margin: 0 10px;
            font-weight: bold;
        }

        /* Container for the iframes */
        #content-area {
            position: relative;
            flex-grow: 1;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        #iframe-scaler {
            transform-origin: top left;
            transition: transform 0.2s ease-in-out;
        }

        /* Iframe styling */
        .content-frame {
            height: 100%; 
            width: 100%;
            border: none;
            display: none;
        }
        .content-frame.visible {
            display: block;
        }
        
        /* Media query for smaller screens */
        @media (max-width: 768px) {
            #top-nav {
                font-size: 0.6em;
                padding: 8px 10px; /* Reduced padding */
            }
            #top-nav h2 {
                margin-right: 10px;
            }
            #top-nav a {
                padding: 6px 8px;
                margin: 0 2px; /* Reduced margin */
            }
        }
    </style>
</head>
<body>

    <nav id="top-nav">
        <div class="nav-section">
            <h2>Key Count:</h2>
            <a class="active" data-target-frame="frame-0">20M</a>
            <a data-target-frame="frame-1">2M</a>
            <a data-target-frame="frame-2">200K</a>
            <a data-target-frame="frame-3">20K</a>
        </div>
        <div class="nav-section zoom-controls">
            <button id="zoom-out">-</button>
            <span id="zoom-level">100%</span>
            <button id="zoom-in">+</button>
        </div>
    </nav>

    <div id="content-area">
        <div id="iframe-scaler">
            <iframe id="frame-0" class="content-frame visible" src="benchmark_results_perf_report_20M.html"></iframe>
            <iframe id="frame-1" class="content-frame" src="benchmark_results_perf_report_2M.html"></iframe>
            <iframe id="frame-2" class="content-frame" src="benchmark_results_perf_report_200K.html"></iframe>
            <iframe id="frame-3" class="content-frame" src="benchmark_results_perf_report_20K.html"></iframe>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const topNav = document.getElementById('top-nav');
            const navLinks = topNav.querySelectorAll('a[data-target-frame]');
            const frames = document.querySelectorAll('.content-frame');
            
            const zoomInBtn = document.getElementById('zoom-in');
            const zoomOutBtn = document.getElementById('zoom-out');
            const zoomLevelDisplay = document.getElementById('zoom-level');
            const iframeScaler = document.getElementById('iframe-scaler');
            
            const isMobile = window.innerWidth <= 768;
            // Default zoom set to 30% for mobile
            let currentZoom = isMobile ? 0.3 : 1.0; 

            const updateZoom = () => {
                iframeScaler.style.transform = `scale(${currentZoom})`;
                zoomLevelDisplay.textContent = `${Math.round(currentZoom * 100)}%`;
                iframeScaler.style.width = `${100 / currentZoom}%`;
                iframeScaler.style.height = `${100 / currentZoom}%`;
            };

            zoomInBtn.addEventListener('click', () => {
                currentZoom = Math.min(3.0, currentZoom + 0.1);
                updateZoom();
            });

            zoomOutBtn.addEventListener('click', () => {
                currentZoom = Math.max(0.2, currentZoom - 0.1);
                updateZoom();
            });

            topNav.addEventListener('click', (event) => {
                const targetLink = event.target.closest('a[data-target-frame]');
                if (!targetLink) return;

                navLinks.forEach(link => link.classList.remove('active'));
                targetLink.classList.add('active');

                const targetFrameId = targetLink.getAttribute('data-target-frame');
                frames.forEach(frame => {
                    frame.classList.toggle('visible', frame.id === targetFrameId);
                });
            });
            
            updateZoom();
        });
    </script>

</body>
</html>
