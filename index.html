<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benchmark Reports</title>
    <style>
        /* CSS for layout and styling */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden; /* Prevent body scrollbars */
        }

        /* Styles for the top navigation bar */
        #top-nav { 
            background-color: #333;
            color: #fff;
            padding: 10px 20px; 
            border-bottom: 1px solid #555;
            box-sizing: border-box;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            z-index: 10;
        }
        #top-nav h2 {
            margin: 0;
            margin-right: 20px;
            font-size: 1em;
            font-weight: bold;
            text-transform: uppercase;
        }
        #top-nav a { 
            padding: 8px 12px; 
            margin: 0 5px;
            text-decoration: none; 
            color: #fff;
            border-radius: 5px;
            transition: background-color 0.2s;
            cursor: pointer;
        }
        #top-nav a:hover { 
            background-color: #555;
        }
        #top-nav a.active {
            background-color: #007BFF;
            color: #fff;
        }

        /* Container for the iframes */
        #content-area {
            position: relative;
            flex-grow: 1;
        }

        /* Iframe styling */
        .content-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            visibility: hidden; /* Hide frames by default */
        }
        .content-frame.visible {
            visibility: visible; /* Show the active frame */
        }
    </style>
</head>
<body>

    <nav id="top-nav">
        <h2>Hash Table Size:</h2>
        <a class="active" data-target-frame="frame-0">20M Keys</a>
        <a data-target-frame="frame-1">2M Keys</a>
        <a data-target-frame="frame-2">200K Keys</a>
        <a data-target-frame="frame-3">20K Keys</a>
    </nav>

    <div id="content-area">
        <iframe id="frame-0" class="content-frame visible" src="benchmark_results_perf_report_20M.html"></iframe>
        <iframe id="frame-1" class="content-frame" src="benchmark_results_perf_report_2M.html"></iframe>
        <iframe id="frame-2" class="content-frame" src="benchmark_results_perf_report_200K.html"></iframe>
        <iframe id="frame-3" class="content-frame" src="benchmark_results_perf_report_20K.html"></iframe>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const topNav = document.getElementById('top-nav');
            const navLinks = topNav.querySelectorAll('a');
            const frames = document.querySelectorAll('.content-frame');

            topNav.addEventListener('click', (event) => {
                const targetLink = event.target.closest('a[data-target-frame]');
                if (!targetLink) return;

                // Update active link style
                navLinks.forEach(link => link.classList.remove('active'));
                targetLink.classList.add('active');

                // Show the target iframe and hide the others
                const targetFrameId = targetLink.getAttribute('data-target-frame');
                frames.forEach(frame => {
                    if (frame.id === targetFrameId) {
                        frame.classList.add('visible');
                    } else {
                        frame.classList.remove('visible');
                    }
                });
            });
        });
    </script>

</body>
</html>
